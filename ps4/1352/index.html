<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PS4 · WebKit → HEN</title>
<style>
  /* ── Design tokens ────────────────────────────────────────── */
  :root {
    --bg:        #07090d;
    --bg-2:      #0b0e13;
    --panel:     #10141c;
    --panel-2:   #0d1118;
    --border:    #1e2533;
    --border-2:  #2a3344;
    --text:      #c9d4e3;
    --text-dim:  #6b7a90;
    --text-mute: #48546a;
    --accent:    #4aa3ff;
    --accent-2:  #2b7fd4;
    --pass:      #3ddc84;
    --fail:      #ff5c5c;
    --warn:      #ffb020;
    --info:      #8fa6c4;
    --pink:      #ff5ca8;
    --violet:    #a78bfa;
    --radius:    10px;
    --radius-sm: 6px;
    --mono:      ui-monospace, 'SF Mono', 'JetBrains Mono', 'Courier New', monospace;
    --sans:      -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(1200px 700px at 50% -10%, rgba(74,163,255,.10), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, rgba(167,139,250,.06), transparent 55%);
    color: var(--text);
    font: 13px/1.5 var(--sans);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Shell layout ─────────────────────────────────────────── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    padding: 14px;
    gap: 12px;
  }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 16px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      transparent 0%, rgba(74,163,255,.08) 50%, transparent 100%);
    pointer-events: none;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .logo {
    width: 38px; height: 38px;
    border-radius: 9px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent) 0%, var(--violet) 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.06) inset,
      0 6px 20px -8px rgba(74,163,255,.6);
    flex: 0 0 auto;
  }
  .logo svg { width: 22px; height: 22px; display: block; }
  .title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .2px;
    color: #e6edf7;
    line-height: 1.15;
  }
  .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    letter-spacing: .3px;
    margin-top: 3px;
  }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .4px;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge.accent { color: var(--accent); border-color: #1f4a7a; background: #0b1725; }
  .badge.violet { color: var(--violet); border-color: #3c2f66; background: #14102a; }

  /* ── Info grid ────────────────────────────────────────────── */
  .info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
  }
  .info-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .info-label {
    font-size: 10px;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--text-mute);
    font-family: var(--mono);
  }
  .info-value {
    font-family: var(--mono);
    font-size: 13px;
    color: #d8e2f0;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .info-value.good  { color: var(--pass); }
  .info-value.bad   { color: var(--fail); }
  .info-value.warn  { color: var(--warn); }

  /* ── Status bar ───────────────────────────────────────────── */
  #state {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 5px solid var(--text-mute);
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    color: var(--text-dim);
    transition: border-color .2s, color .2s, background .2s;
    min-height: 48px;
  }
  #state::before {
    content: '';
    width: 10px; height: 10px;
    border-radius: 50%;
    background: currentColor;
    flex: 0 0 auto;
    box-shadow: 0 0 0 0 currentColor;
  }
  #state.run  { color: var(--accent); border-left-color: var(--accent); }
  #state.run::before { animation: pulse 1.1s infinite; }
  #state.ok   { color: var(--pass);   border-left-color: var(--pass);   background: #0a1710; }
  #state.bad  { color: var(--fail);   border-left-color: var(--fail);   background: #170a0a; }
  #state.warn { color: var(--warn);   border-left-color: var(--warn);   background: #17120a; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,163,255,.7); }
    70%  { box-shadow: 0 0 0 8px rgba(74,163,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,163,255,0); }
  }

  /* ── Toolbar ──────────────────────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-size: 12px;
    font-family: var(--mono);
    font-weight: 600;
    letter-spacing: .3px;
    padding: 9px 14px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .05s, box-shadow .15s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  button:hover:not(:disabled) {
    background: #182031;
    border-color: var(--border-2);
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled {
    opacity: .4;
    cursor: not-allowed;
  }
  button svg { width: 14px; height: 14px; flex: 0 0 auto; }

  #btnStart {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    border-color: #1f4a7a;
    color: #eaf4ff;
    font-weight: 700;
    padding: 10px 20px;
    box-shadow: 0 6px 20px -10px rgba(74,163,255,.9);
  }
  #btnStart:hover:not(:disabled) {
    background: linear-gradient(135deg, #5aabff 0%, #3a8fdf 100%);
  }
  #btnStart:disabled { filter: grayscale(.4); }

  .toolbar .spacer { flex: 1 1 auto; }
  .toolbar .meta {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-mute);
    letter-spacing: .4px;
    white-space: nowrap;
  }

  /* ── Console ──────────────────────────────────────────────── */
  .console {
    flex: 1 1 auto;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    background: #05070a;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .console-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--text-mute);
  }
  .dots { display: flex; gap: 5px; margin-right: 10px; }
  .dots i {
    width: 9px; height: 9px; border-radius: 50%;
    background: #2a3344;
    display: inline-block;
  }
  .dots i:nth-child(1) { background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; }
  .dots i:nth-child(3) { background: #28c840; }
  .console-head-left { display: flex; align-items: center; gap: 4px; }

  #out {
    flex: 1 1 auto;
    overflow: auto;
    margin: 0;
    padding: 10px 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    color: var(--info);
    white-space: pre-wrap;
    word-break: break-word;
    scrollbar-width: thin;
    scrollbar-color: #263043 #0a0d12;
  }
  #out::-webkit-scrollbar { width: 10px; height: 10px; }
  #out::-webkit-scrollbar-track { background: #0a0d12; }
  #out::-webkit-scrollbar-thumb {
    background: #263043;
    border-radius: 5px;
    border: 2px solid #0a0d12;
  }
  #out::-webkit-scrollbar-thumb:hover { background: #33415a; }
  #out .ok   { color: var(--pass); font-weight: 600; }
  #out .bad  { color: var(--fail); font-weight: 600; }
  #out .warn { color: var(--warn); }

  /* ── Footer note ──────────────────────────────────────────── */
  footer {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-mute);
    text-align: center;
    letter-spacing: .4px;
    padding-bottom: 2px;
  }
  footer code {
    color: var(--text-dim);
    background: var(--panel-2);
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* ── Responsive ───────────────────────────────────────────── */
  @media (max-width: 520px) {
    .shell { padding: 10px; gap: 10px; }
    header { padding: 12px; }
    .title { font-size: 14px; }
    .info { grid-template-columns: 1fr 1fr; }
    .info-value { font-size: 12px; }
    #out { font-size: 11px; padding: 8px 10px; }
    .toolbar .meta { display: none; }
    #btnStart { flex: 1 1 auto; justify-content: center; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- ═══ HEADER ═══ -->
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
      <div style="min-width:0">
        <div class="title">WebKit → HEN</div>
        <div class="subtitle">PS4 firmware 13.52 · jailbreak chain</div>
      </div>
    </div>
    <div class="badges">
      <span class="badge accent" id="badgeFw">fw —</span>
      <span class="badge" id="badgeStage">stage 0/10</span>
      <span class="badge violet">rev 2.2.0</span>
    </div>
  </header>

  <!-- ═══ INFO GRID ═══ -->
  <div class="info">
    <div class="info-card">
      <span class="info-label">Firmware</span>
      <span class="info-value" id="infoFw">detecting…</span>
    </div>
    <div class="info-card">
      <span class="info-label">User agent</span>
      <span class="info-value" id="infoUa">—</span>
    </div>
    <div class="info-card">
      <span class="info-label">Payload</span>
      <span class="info-value" id="infoPayload">not loaded</span>
    </div>
    <div class="info-card">
      <span class="info-label">Elapsed</span>
      <span class="info-value" id="infoElapsed">00:00</span>
    </div>
  </div>

  <!-- ═══ STATUS BAR ═══ -->
  <div id="state">idle — press START to begin</div>

  <!-- ═══ TOOLBAR ═══ -->
  <div class="toolbar">
    <button id="btnStart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round">
        <polygon points="6 3 20 12 6 21 6 3"></polygon>
      </svg>
      START EXPLOIT
    </button>
    <button id="btnDownload" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      LOG
    </button>
    <button id="btnCopy" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      COPY
    </button>
    <button id="btnClear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
      </svg>
      CLEAR
    </button>
    <span class="spacer"></span>
    <span class="meta" id="toolbarMeta">rev 2.2.0 · idle</span>
  </div>

  <!-- ═══ CONSOLE ═══ -->
  <div class="console">
    <div class="console-head">
      <div class="console-head-left">
        <span class="dots"><i></i><i></i><i></i></span>
        <span>console output</span>
      </div>
      <span id="consoleCount">0 lines</span>
    </div>
    <pre id="out"></pre>
  </div>

  <footer>
    Press <code>START</code> · full chain runs automatically · logs downloadable above
  </footer>

</div>

<script type="module">
/* ============================================================
 *  index.html · boot script
 *  Handles UI wiring and defers the actual chain to chain_hen.mjs
 * ============================================================ */

const $  = id => document.getElementById(id);
const stateEl      = $("state");
const outEl        = $("out");
const btnStart     = $("btnStart");
const btnDownload  = $("btnDownload");
const btnCopy      = $("btnCopy");
const btnClear     = $("btnClear");
const badgeFw      = $("badgeFw");
const badgeStage   = $("badgeStage");
const infoFw       = $("infoFw");
const infoUa       = $("infoUa");
const infoPayload  = $("infoPayload");
const infoElapsed  = $("infoElapsed");
const toolbarMeta  = $("toolbarMeta");
const consoleCount = $("consoleCount");

let startTime = 0;
let elapsedTimer = null;

/* ── Firmware detection preview (before chain loads) ──────── */
(function detectFw() {
    const ua = navigator.userAgent;
    infoUa.textContent = ua.slice(0, 80) + (ua.length > 80 ? "…" : "");
    infoUa.title = ua;

    let fw = null;
    let m = /PlayStation\s+4\/(\d+)\.(\d+)/.exec(ua);
    if (m) fw = m[1] + "." + m[2].padStart(2, "0");
    else {
        m = /PS4\s+Update\s+\((\d+)\.(\d+)\)/.exec(ua);
        if (m) fw = m[1] + "." + m[2].padStart(2, "0");
    }

    if (fw) {
        badgeFw.textContent = "fw " + fw;
        infoFw.textContent  = fw;
        infoFw.className    = "info-value good";
        if (fw === "13.52") {
            badgeFw.className = "badge accent";
        } else {
            badgeFw.className = "badge";
            infoFw.className  = "info-value warn";
            infoFw.title = "Only 13.52 has verified offsets";
        }
    } else {
        badgeFw.textContent = "fw ?";
        infoFw.textContent  = "not detected";
        infoFw.className    = "info-value bad";
    }
})();

/* ── Elapsed timer ────────────────────────────────────────── */
function startElapsed() {
    startTime = Date.now();
    elapsedTimer = setInterval(() => {
        const s = Math.floor((Date.now() - startTime) / 1000);
        const mm = String(Math.floor(s / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        infoElapsed.textContent = mm + ":" + ss;
    }, 250);
}
function stopElapsed() {
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
}

/* ── Line counter (observes mutations on #out) ────────────── */
const lineObserver = new MutationObserver(() => {
    const text = outEl.textContent || "";
    const n = text.split("\n").filter(Boolean).length;
    consoleCount.textContent = n + " lines";
});
lineObserver.observe(outEl, { childList: true, characterData: true, subtree: true });

/* ── Stage badge (parses mark() tags as they arrive) ──────── */
const stageNames = [
    "PRIMITIVE", "PAYLOAD", "KBOOT", "KLEAK", "KRW",
    "STAGE-MMAP", "UCRED", "SYSENT", "EXEC", "HEN-BANNER"
];
const seenStages = new Set();
const stageObserver = new MutationObserver(() => {
    const text = outEl.textContent || "";
    stageNames.forEach((name, i) => {
        if (!seenStages.has(name) && text.includes(name)) {
            seenStages.add(name);
            badgeStage.textContent = `stage ${i + 1}/10`;
        }
    });
});
stageObserver.observe(outEl, { childList: true, subtree: true, characterData: true });

/* ── Hook mark() output to also update payload info ───────── */
const payloadObserver = new MutationObserver(() => {
    const text = outEl.textContent || "";
    const m = /PAYLOAD-LOADED\s+(\d+)\s+bytes/.exec(text);
    if (m) {
        const bytes = Number(m[1]);
        infoPayload.textContent = (bytes / 1024).toFixed(1) + " KB";
        infoPayload.className   = "info-value good";
    }
});
payloadObserver.observe(outEl, { childList: true, subtree: true, characterData: true });

/* ── Start the chain ──────────────────────────────────────── */
btnStart.addEventListener("click", async () => {
    btnStart.disabled = true;
    btnStart.textContent = "RUNNING…";
    stateEl.textContent = "starting chain…";
    stateEl.className = "run";
    toolbarMeta.textContent = "rev 2.2.0 · running";
    startElapsed();

    outEl.textContent = "";
    seenStages.clear();
    badgeStage.textContent = "stage 0/10";
    consoleCount.textContent = "0 lines";

    try {
        const mod = await import("./chain_hen.mjs");
        await mod.runHENChain();

        // Chain's own setState will have already set the final class,
        // but make sure buttons are enabled once we return.
        btnDownload.disabled = false;
        btnCopy.disabled     = false;
        toolbarMeta.textContent = "rev 2.2.0 · done";
        badgeStage.textContent  = "stage 10/10";
    } catch (err) {
        stateEl.textContent = "fatal — " + (err && err.message || err);
        stateEl.className = "bad";
        outEl.innerHTML += "\n<span class=\"bad\">FATAL: "
            + String(err && err.stack || err).replace(/[&<>]/g,
                c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]))
            + "</span>";
        toolbarMeta.textContent = "rev 2.2.0 · failed";
        btnDownload.disabled = false;
        btnCopy.disabled     = false;
    } finally {
        stopElapsed();
        btnStart.textContent = "RESTART CHAIN";
        btnStart.disabled = false;
    }
});

/* ── Download log ─────────────────────────────────────────── */
btnDownload.addEventListener("click", () => {
    const text = outEl.textContent || "";
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    a.href = url;
    a.download = "ps4-hen-log-" + stamp + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
});

/* ── Copy log ─────────────────────────────────────────────── */
btnCopy.addEventListener("click", async () => {
    const text = outEl.textContent || "";
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
        } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
        }
        const orig = btnCopy.textContent;
        btnCopy.textContent = "COPIED";
        setTimeout(() => { btnCopy.textContent = orig; }, 1200);
    } catch (_) {
        btnCopy.textContent = "FAILED";
        setTimeout(() => { btnCopy.textContent = "COPY"; }, 1200);
    }
});

/* ── Clear log ────────────────────────────────────────────── */
btnClear.addEventListener("click", () => {
    outEl.textContent = "";
    consoleCount.textContent = "0 lines";
    seenStages.clear();
    badgeStage.textContent = "stage 0/10";
});

/* ── Keyboard shortcut: Enter to start ────────────────────── */
document.addEventListener("keydown", e => {
    if (e.key === "Enter" && !btnStart.disabled && document.activeElement === document.body) {
        btnStart.click();
    }
});
</script>
</body>
</html>
